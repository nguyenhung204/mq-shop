openapi: 3.0.3
info:
  title: MQ Shopping Shop Onboarding API
  version: 1.0.0
  description: Shop application, admin approval lifecycle, and violation handling.
servers:
  - url: /api/v1
tags:
  - name: Shop
  - name: ShopAdmin
paths:
  /shops/apply:
    post:
      tags: [Shop]
      summary: Submit or resubmit shop application (BUYER)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ShopApplyRequest"
      responses:
        "201":
          description: Application saved as PENDING
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not a BUYER
        "409":
          description: Duplicate name/tax or one-shop rule
  /shops/me:
    get:
      tags: [Shop]
      summary: Get current user's shop (any status)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Shop details including contact-Admin guidance when violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopResponse"
        "404":
          description: No shop yet
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/shops:
    get:
      tags: [ShopAdmin]
      summary: List shops for admin review (paginated)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED]
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Shop page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopPage"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/shops/{shopId}:
    get:
      tags: [ShopAdmin]
      summary: Shop application detail
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/shopId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/shops/{shopId}/approve:
    post:
      tags: [ShopAdmin]
      summary: Approve PENDING shop — APPROVED + grant SELLER
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/shopId"
      responses:
        "200":
          description: Approved; owner notified async
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopResponse"
        "409":
          description: Not PENDING or concurrent conflict
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/shops/{shopId}/reject:
    post:
      tags: [ShopAdmin]
      summary: Reject PENDING shop with mandatory reason
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/shopId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectShopRequest"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopResponse"
        "400":
          description: Missing or too-long reason
        "409":
          description: Not PENDING
  /admin/shops/{shopId}/violation-lock:
    post:
      tags: [ShopAdmin]
      summary: Violation lock on APPROVED shop → REJECTED + suspended
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/shopId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 150
      responses:
        "200":
          description: Violation applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopResponse"
        "409":
          description: Shop not APPROVED
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    shopId:
      in: path
      name: shopId
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    ShopApplyRequest:
      type: object
      required: [name, taxId, countryCode, document]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        taxId:
          type: string
          pattern: "^[0-9]{1,15}$"
        countryCode:
          type: string
          minLength: 2
          maxLength: 2
          example: VN
        document:
          type: string
          format: binary
    RejectShopRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 150
    Shop:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        name:
          type: string
        taxId:
          type: string
        countryCode:
          type: string
        documentUrl:
          type: string
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        rejectionReason:
          type: string
          nullable: true
        violationFlag:
          type: boolean
        isSuspended:
          type: boolean
        contactAdminRequired:
          type: boolean
          description: true when violationFlag — owner UX guidance
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ShopResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Shop"
    ShopPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Shop"
        meta:
          type: object
          properties:
            page:
              type: integer
            pageSize:
              type: integer
            total:
              type: integer
  responses:
    BadRequest:
      description: Validation error
    Unauthorized:
      description: Not authenticated
    Forbidden:
      description: Not authorized
    NotFound:
      description: Not found
