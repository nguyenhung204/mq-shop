openapi: 3.0.3
info:
  title: MQ Shopping Internal Admin & Compliance API
  version: 1.0.0
  description: >
    Staff provisioning, immutable audit logs, async backups, and PII anonymization.
servers:
  - url: /api/v1
tags:
  - name: Staff
  - name: Audit
  - name: Backup
  - name: Compliance
paths:
  /admin/staff:
    post:
      tags: [Staff]
      summary: Create staff account (Admin → PENDING; SuperAdmin → ACTIVE)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStaffRequest"
      responses:
        "201":
          description: Staff created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffAccountResponse"
        "403":
          description: Escalation blocked or unauthorized
    get:
      tags: [Staff]
      summary: List staff accounts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Staff list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/StaffAccountResponse"
  /admin/staff/{id}:
    patch:
      tags: [Staff]
      summary: Update staff (Admin → PENDING change; SuperAdmin → immediate)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StaffId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStaffRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffAccountResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/staff/{id}/approve:
    post:
      tags: [Staff]
      summary: Super Admin approve PENDING staff/permission change
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StaffId"
      responses:
        "200":
          description: ACTIVE + force logout triggered
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No pending change
  /admin/audit-logs:
    get:
      tags: [Audit]
      summary: Filtered immutable audit event grid (BR_01 read-only)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: accountName
          schema:
            type: string
        - in: query
          name: ip
          schema:
            type: string
        - in: query
          name: action
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Paginated audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogPage"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/backups:
    post:
      tags: [Backup]
      summary: Super Admin start FULL or PARTIAL backup (async)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [backupType]
              properties:
                backupType:
                  type: string
                  enum: [FULL, PARTIAL]
      responses:
        "202":
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupJobResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/backups/{id}:
    get:
      tags: [Backup]
      summary: Poll backup job progress and download link
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupJobResponse"
  /admin/deletion-requests:
    post:
      tags: [Compliance]
      summary: Create customer personal-data deletion request
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subjectUserId]
              properties:
                subjectUserId:
                  type: string
                  format: uuid
                notes:
                  type: string
      responses:
        "201":
          description: Request created (OPEN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionRequestResponse"
  /admin/deletion-requests/{id}/review:
    post:
      tags: [Compliance]
      summary: Admin review and escalate request
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: ESCALATED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionRequestResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/deletion-requests/{id}/execute:
    post:
      tags: [Compliance]
      summary: Super Admin execute anonymization (atomic, no DELETE)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Anonymization completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionRequestResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Request not escalated or already completed
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    StaffId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    RequestId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Forbidden:
      description: Missing permission or escalation blocked
  schemas:
    CreateStaffRequest:
      type: object
      required: [userId, personnelInfo, permissionCodes]
      properties:
        userId:
          type: string
          format: uuid
        personnelInfo:
          type: object
        permissionCodes:
          type: array
          items:
            type: string
    UpdateStaffRequest:
      type: object
      properties:
        personnelInfo:
          type: object
        permissionCodes:
          type: array
          items:
            type: string
    StaffAccountResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, ACTIVE, SUSPENDED]
        permissionCodes:
          type: array
          items:
            type: string
        pendingChange:
          type: boolean
    AuditLogEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
        actorName:
          type: string
        action:
          type: string
        ip:
          type: string
        oldData:
          type: object
          nullable: true
        newData:
          type: object
          nullable: true
        occurredAt:
          type: string
          format: date-time
    AuditLogPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogEvent"
        meta:
          $ref: "#/components/schemas/PageMeta"
    BackupJobResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        backupType:
          type: string
          enum: [FULL, PARTIAL]
        status:
          type: string
          enum: [QUEUED, RUNNING, COMPLETED, FAILED]
        progressPercent:
          type: integer
        downloadUrl:
          type: string
          nullable: true
        errorMessage:
          type: string
          nullable: true
    DeletionRequestResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        subjectUserId:
          type: string
          format: uuid
        status:
          type: string
          enum: [OPEN, REVIEWED, ESCALATED, COMPLETED]
        executedAt:
          type: string
          format: date-time
          nullable: true
    PageMeta:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
